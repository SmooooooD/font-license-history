name: keywords
on:
  workflow_dispatch:
    inputs:
      words:
        description: "쉼표로 구분한 키워드"
        required: true
permissions: {}
jobs:
  run:
    if: github.actor == github.repository_owner   # 저장소 주인이 실행할 때만
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/naver_keywords.py "$WORDS"
        env:
          WORDS: ${{ github.event.inputs.words }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
          NAVER_ACCESS_LICENSE: ${{ secrets.NAVER_ACCESS_LICENSE }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
      - name: commit
        run: |
          git config user.name "font-license-history bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "keywords $(date -u +%Y-%m-%d)"
          git push
