name: keywords
on:
  workflow_dispatch:
    inputs:
      words:
        description: "쉼표로 구분한 키워드"
        required: false
  push:
    branches: [main]
    paths: ["queries/*.txt"]   # 조회할 키워드 파일을 올리면 자동 실행 (저장소 쓰기 권한자만 가능)
permissions: {}
jobs:
  run:
    # 수동 실행은 저장소 주인만, 자동 실행은 main에 키워드 파일이 올라올 때만
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: query
        run: |
          if [ -z "$WORDS" ]; then
            F=$(git diff --name-only HEAD~1 HEAD -- 'queries/*.txt' | tail -1)
            WORDS=$(tr '\n' ',' < "$F")
          fi
          python scripts/naver_keywords.py "$WORDS"
        env:
          WORDS: ${{ github.event.inputs.words }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
          NAVER_ACCESS_LICENSE: ${{ secrets.NAVER_ACCESS_LICENSE }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
      - name: commit
        run: |
          git config user.name "font-license-history bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "keywords $(date -u +%Y-%m-%d)"
          git push
