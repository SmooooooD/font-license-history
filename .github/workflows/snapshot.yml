name: snapshot
on:
  schedule:
    - cron: "17 3,15 * * *"   # 하루 두 번 (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sources.csv", "scripts/snapshot.py"]   # 대상이나 수집 코드가 바뀌면 바로 한 번 실행
permissions: {}               # 기본 권한 없음
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write         # records 커밋에만 필요
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: python scripts/snapshot.py
      - name: commit if changed
        run: |
          git config user.name "font-license-history bot"
          git config user.email "actions@users.noreply.github.com"
          git add records runs
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
